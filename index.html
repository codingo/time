<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Time Converter</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta/dist/vanta.triangles.min.js"></script>
</head>
<body>
  <div id="vanta-bg"></div>
  <div class="container">
    <h1>Time Converter</h1>

    <div class="controls">
      <input 
        id="timezone-input" 
        type="text" 
        placeholder="Add a timezone: e.g., Gold Coast, San Fr, London, Tokyo, PT..."
      />
      <button id="add-timezone" class="btn-primary">+ Add timezone</button>
      <button id="remove-all" class="btn-secondary">Remove all</button>
    </div>

    <div class="sort">
      <label for="sort-select">Sort by</label>
      <select id="sort-select">
        <option value="city-asc">↑ City (asc.)</option>
        <option value="city-desc">↓ City (desc.)</option>
        <option value="offset-asc">↑ Offset</option>
        <option value="offset-desc">↓ Offset</option>
      </select>
    </div>

    <p class="share">Shareable links by copying the current URL</p>
    <div id="timezones"></div>

    <div class="linkbar">
      <button id="use-selected-time" class="btn-primary">Use selected time</button>
      <input id="share-link" type="text" readonly />
      <button id="copy-link" class="btn-secondary">Copy</button>
    </div>

    <footer>
      <div class="socials">
        <a href="https://twitter.com/codingo" target="_blank">
          <img src="twitter.svg" alt="Twitter" class="social-icon"/>
        </a>
        <a href="https://github.com/codingo" target="_blank">
          <img src="github.svg" alt="GitHub" class="social-icon"/>
        </a>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
  <script>
    VANTA.TRIANGLES({
      el: "#vanta-bg",
      mouseControls: true,
      touchControls: true,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      scaleMobile: 1.00,
      color1: 0x1a1aff,
      color2: 0x00ff99,
      backgroundColor: 0x000000,
      size: 1.50,
      speed: 2.00
    })
  </script>
</body>
</html>
