<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Time Converter — codingo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Animated gradient background layer -->
  <div class="bg-anim" aria-hidden="true"></div>

  <header class="site-header">
    <a href="https://codingo.com" class="logo-link" target="_blank" rel="noopener">
      <video autoplay loop muted playsinline class="logo-video">
        <source src="codingo-logo.webm" type="video/webm" />
        <img src="fallback-logo.png" alt="Codingo Logo" />
      </video>
    </a>
    <h1>Time Converter</h1>
  </header>

  <main>
    <div class="controls">
      <div class="add-wrap">
        <input id="zone-input" list="tzlist" class="zone-input"
               placeholder="Add a timezone: e.g., Gold Coast, San Fr, London, Tokyo, PT…" />
        <datalist id="tzlist"></datalist>
        <button id="add-zone" title="Add selected timezone">+ Add timezone</button>
      </div>
      <p class="shareable">Shareable links by copying the current URL</p>
    </div>

    <div id="zones"></div>
  </main>
