<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time Zone Converter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Time Zone Converter</h1>
    <p>Select a reference date & time, and see the local time in multiple cities.</p>
  </header>

  <section id="controls">
    <!-- Base time controls -->
    <label for="baseZone">Base Timezone:</label>
    <select id="baseZone"></select>
    <label for="baseDate">Date:</label>
    <input type="date" id="baseDate" />
    <label for="baseTime">Time:</label>
    <input type="time" id="baseTime" step="900" />
  </section>

  <section id="zonesList">
    <!-- Zone entries will be injected here -->
  </section>

  <section id="addZone">
    <input list="zoneOptions" id="newZoneInput" placeholder="Add city or time zone..." />
    <datalist id="zoneOptions">
      <!-- populated with options via script (common cities/timezones) -->
    </datalist>
    <button id="addZoneBtn">Add</button>
  </section>

  <!-- SVG icons (smiley and sad face) defined once and reused via <use> -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
    <symbol id="icon-smile" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="8" fill="#88cc88"></circle>
      <circle cx="5.5" cy="6" r="1.5" fill="#000"></circle>
      <circle cx="10.5" cy="6" r="1.5" fill="#000"></circle>
      <path d="M4 10a4 4 0 0 0 8 0H4z" fill="#000"></path>
    </symbol>
    <symbol id="icon-sad" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="8" fill="#cccccc"></circle>
      <circle cx="5.5" cy="6" r="1.5" fill="#000"></circle>
      <circle cx="10.5" cy="6" r="1.5" fill="#000"></circle>
      <path d="M4 11a4 4 0 0 1 8 0H4z" fill="#000"></path>
    </symbol>
  </svg>

  <script src="script.js"></script>
</body>
</html>
