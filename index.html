<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Time Converter — codingo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <video autoplay loop muted playsinline class="logo-video">
      <source src="codingo-logo.webm" type="video/webm" />
      <img src="fallback-logo.png" alt="Codingo Logo" />
    </video>
    <h1>Time Converter</h1>
  </header>

  <main>
    <div class="controls">
      <div class="add-wrap">
        <input id="zone-input" list="tzlist" class="zone-input"
               placeholder="Add a timezone: e.g., Gold Coast, San Fr, London, Tokyo, PT…" />
        <datalist id="tzlist"></datalist>
        <button id="add-zone" title="Add selected timezone">+ Add timezone</button>
      </div>
      <p class="shareable">Shareable links by copying the current URL</p>
    </div>

    <div id="zones"></div>
  </main>

  <footer>
    <div class="socials">
      <a href="https://www.linkedin.com/in/skeltonm/" target="_blank" rel="noopener">LinkedIn</a> •
      <a href="https://x.com/codingo_" target="_blank" rel="noopener">Twitter</a> •
      <a href="https://github.com/codingo/" target="_blank" rel="noopener">GitHub</a> •
      <a href="https://youtube.com/codingo" target="_blank" rel="noopener">YouTube</a>
    </div>
  </footer>

  <!-- ES modules -->
  <script type="module" src="app.js"></script>
</body>
</html>
