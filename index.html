<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Time Planner — codingo/time</title>
<meta name="description" content="Compare times across multiple cities instantly. Shows working hours, public holidays, and weekend flags. Shareable links.">
<meta property="og:title" content="Time Planner — codingo/time">
<meta property="og:description" content="Compare times across cities instantly. Working hours, public holidays, shareable links.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://codingo.com/time">
<meta name="twitter:card" content="summary">
<meta name="twitter:site" content="@codingo_">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0d0f;
  --surface: #13161a;
  --surface2: #1a1e24;
  --border: rgba(255,255,255,0.07);
  --border-mid: rgba(255,255,255,0.13);
  --text: #e2e8f0;
  --text2: #7080a0;
  --text3: #3a4560;
  --accent: #3ddc84;
  --accent-dim: rgba(61,220,132,0.10);
  --green: #3ddc84;
  --amber: #f0a500;
  --orange: #ea580c;
  --red: #f87171;
  --mono: 'DM Mono','Courier New',monospace;
  --sans: 'DM Sans',system-ui,sans-serif;
  --rad: 10px;
  --rad-sm: 7px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.55;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--accent);text-decoration:none}
button{font-family:var(--sans);cursor:pointer}

#fss-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:0;transition:opacity 1.2s ease}
#fss-canvas.ready{opacity:1}
#app-backdrop{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;background:rgba(11,13,15,0.80);pointer-events:none;opacity:0;transition:opacity 1.4s ease}
#app-backdrop.ready{opacity:1}
.wrap,.site-footer{position:relative;z-index:1}

.wrap{max-width:820px;margin:0 auto;padding:0 20px}

.hdr{padding:36px 0 28px;border-bottom:1px solid var(--border);margin-bottom:24px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.hdr-brand{display:flex;align-items:center;gap:12px}
.hdr-logo{width:44px;height:44px;background:transparent;border-radius:0;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.hdr-logo video,.hdr-logo img{width:44px;height:44px;object-fit:contain;display:block}
@keyframes hue-spin{
  0%  {filter:hue-rotate(0deg)  drop-shadow(0 0 5px rgba(61,220,132,0.35))}
  50% {filter:hue-rotate(40deg) drop-shadow(0 0 9px rgba(61,220,132,0.55))}
  100%{filter:hue-rotate(0deg)  drop-shadow(0 0 5px rgba(61,220,132,0.35))}
}
.codingo-mark{animation:hue-spin 12s ease-in-out infinite}
.hdr h1{font-size:1.35rem;font-weight:600;letter-spacing:-0.025em;line-height:1.1;font-family:var(--mono)}
.hdr-sub{font-size:0.75rem;color:var(--text2);white-space:nowrap;padding-bottom:2px;font-family:var(--mono);opacity:0.6;transition:opacity 0.15s}
.hdr-sub:hover{opacity:1}

.site-footer{max-width:820px;margin:0 auto;padding:16px 20px calc(20px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px}
.footer-brand{font-family:var(--mono);font-size:11px;color:var(--text3);transition:color 0.15s}
.footer-brand:hover{color:var(--accent)}
.footer-socials{display:flex;gap:18px;align-items:center}
.footer-social{color:var(--text3);display:flex;align-items:center;transition:color 0.15s}
.footer-social:hover{color:var(--accent)}
.footer-social svg{display:block}

.search-wrap{position:relative;margin-bottom:14px}
.search-row{display:flex;align-items:center;background:var(--surface);border:1px solid var(--border-mid);border-radius:var(--rad);transition:border-color 0.15s,box-shadow 0.15s}
.search-row:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.search-icon{padding:0 12px;color:var(--text3);flex-shrink:0;display:flex;align-items:center}
#search{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:var(--sans);font-size:16px;padding:11px 0}
#search::placeholder{color:var(--text3)}
.search-hint{font-size:0.7rem;color:var(--text3);padding-right:12px;white-space:nowrap;flex-shrink:0}

.chips-wrap{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--surface);border:1px solid var(--border-mid);color:var(--text2);font-size:11px;padding:4px 10px 4px 8px;border-radius:20px;cursor:pointer;transition:background 0.1s,border-color 0.1s,color 0.1s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.chip:hover{background:var(--surface2);border-color:var(--accent);color:var(--text)}
.chip-flag{font-size:13px;line-height:1}

.ac{position:absolute;top:calc(100% + 5px);left:0;right:0;background:var(--surface);border:1px solid var(--border-mid);border-radius:var(--rad);z-index:200;overflow:hidden;max-height:340px;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.6)}
.ac.hidden{display:none}
.ac-item{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;transition:background 0.08s}
.ac-item:hover,.ac-item.hi{background:var(--surface2)}
.ac-item.used{opacity:.35;pointer-events:none}
.ac-flag{font-size:1.2rem;text-align:center;line-height:1}
.ac-name{font-weight:500;font-size:13px}
.ac-country{font-size:11px;color:var(--text2);margin-top:1px}
.ac-meta{font-family:var(--mono);font-size:10px;color:var(--text3);text-align:right}

.list-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;min-height:26px}
.list-hdr.gone{display:none}
.list-hdr-left{font-size:11px;color:var(--text3)}
.btn-ghost{background:transparent;border:1px solid transparent;color:var(--text2);font-size:11px;padding:3px 9px;border-radius:var(--rad-sm);transition:color 0.1s,background 0.1s,border-color 0.1s}
.btn-ghost:hover{color:var(--red);background:rgba(248,113,113,0.08);border-color:rgba(248,113,113,0.2)}

.city-list{display:flex;flex-direction:column;gap:5px}

.city-row{display:grid;grid-template-columns:26px 30px 1fr auto 10px;align-items:center;gap:10px 10px;padding:12px 12px 12px 8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rad);position:relative;transition:border-color 0.12s,background 0.12s,opacity 0.15s,transform 0.1s;cursor:default}
.city-row:hover{background:var(--surface2);border-color:var(--border-mid)}
.city-row:hover .rm-btn{opacity:1}
.city-row:hover .drag-handle{opacity:0.5}
.city-row.dragging{opacity:0.35;transform:scale(0.98)}
.city-row.drag-over{border-color:var(--accent);border-style:dashed}

.drag-handle{opacity:0;cursor:grab;display:flex;flex-direction:column;gap:3px;padding:2px 3px;transition:opacity 0.12s;align-self:center}
.drag-handle span{display:block;width:14px;height:1.5px;background:var(--text2);border-radius:1px}

.row-flag{font-size:1.4rem;line-height:1;text-align:center;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.4))}

.row-meta{min-width:0}
.row-city{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.row-tz{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row-rel{font-size:10px;color:var(--text3);margin-top:1px}

.row-hours{display:flex;align-items:center;gap:5px;margin-top:5px;padding-top:4px;border-top:1px solid var(--border)}
.row-hours-lbl{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:0.05em;text-transform:uppercase;flex-shrink:0;user-select:none;min-width:30px}
.row-hours-sep{color:var(--text3);font-size:10px;flex-shrink:0}
.hours-sel{font-family:var(--mono);font-size:10px;background:var(--surface2);border:1px solid var(--border-mid);border-radius:4px;color:var(--text2);padding:2px 5px;cursor:pointer;outline:none;color-scheme:dark;transition:border-color 0.12s,color 0.12s}
.hours-sel:hover{border-color:rgba(255,255,255,0.25);color:var(--text)}
.hours-sel:focus{border-color:var(--accent);color:var(--text)}

.row-wknd{font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:0.06em;color:var(--amber);background:rgba(240,165,0,0.1);border:1px solid rgba(240,165,0,0.25);border-radius:3px;padding:1px 4px;flex-shrink:0}
.row-hol{font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:0.04em;color:var(--red);background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.25);border-radius:3px;padding:1px 5px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;cursor:help}
.city-row.weekend .date-inp,.city-row.holiday .date-inp{color:var(--amber)}

.row-time-block{text-align:right;min-width:108px;position:relative}
.row-time-block::before{content:'✎';position:absolute;top:2px;left:-16px;font-size:10px;color:var(--text3);opacity:0;transition:opacity 0.15s;pointer-events:none}
.city-row:hover .row-time-block::before{opacity:1}

.time-inp{font-family:var(--mono);font-size:max(1.3rem,16px);font-weight:500;letter-spacing:-0.03em;background:transparent;border:none;border-bottom:1.5px solid transparent;color:var(--text);text-align:right;padding:2px 4px;width:100%;cursor:pointer;outline:none;color-scheme:dark;border-radius:4px 4px 0 0;transition:border-color 0.15s,background 0.12s;line-height:1.2;-webkit-appearance:none}
.time-inp:hover{background:var(--surface2)}
.time-inp:focus{border-bottom-color:var(--accent);background:var(--surface2)}

.date-inp{font-family:var(--sans);font-size:11px;color:var(--text2);background:transparent;border:none;border-bottom:1.5px solid transparent;text-align:right;padding:2px 4px;width:100%;cursor:pointer;outline:none;color-scheme:dark;border-radius:4px 4px 0 0;transition:border-color 0.15s,background 0.12s;-webkit-appearance:none;margin-top:3px;display:block}
.date-inp:hover{background:var(--surface2)}
.date-inp:focus{border-bottom-color:var(--accent);background:var(--surface2)}

.row-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.row-dot.working{background:var(--green);box-shadow:0 0 6px var(--green)}
.row-dot.shoulder{background:var(--amber)}
.row-dot.sleeping{background:var(--text3)}

.rm-btn{position:absolute;top:7px;right:7px;background:none;border:none;color:var(--text3);font-size:14px;line-height:1;width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:4px;opacity:0;transition:opacity 0.12s,color 0.1s,background 0.1s}
.rm-btn:hover{color:var(--red);background:rgba(248,113,113,0.1)}

.city-row.is-ref{border-left:2px solid rgba(61,220,132,0.35)}

.overlap-bar{font-family:var(--mono);font-size:10px;color:var(--text3);margin:6px 0 0;padding:5px 10px;border-radius:var(--rad-sm);display:none;align-items:center;gap:8px}
.overlap-bar.has{color:var(--green);background:rgba(61,220,132,0.06);border:1px solid rgba(61,220,132,0.15);display:flex;cursor:pointer;transition:background 0.1s}
.overlap-bar.has:hover{background:rgba(61,220,132,0.12)}
.overlap-bar.partial{color:var(--amber);background:rgba(240,165,0,0.07);border:1px solid rgba(240,165,0,0.25);display:flex;cursor:pointer;transition:background 0.1s}
.overlap-bar.partial:hover{background:rgba(240,165,0,0.12)}
.overlap-bar.none{color:var(--text2);background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);display:flex}
.ol-msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ol-nav{display:flex;align-items:center;gap:5px;flex-shrink:0;margin-left:auto;padding-left:4px}
.ol-nav.hidden{display:none}
.ol-btn{background:transparent;border:1px solid currentColor;border-radius:4px;color:inherit;font-family:var(--mono);font-size:11px;padding:0 7px;line-height:18px;cursor:pointer;opacity:0.65;transition:opacity 0.1s}
.ol-btn:hover{opacity:1}
.ol-count{font-size:9px;opacity:0.65;white-space:nowrap;min-width:26px;text-align:center}

.tl-wrap{margin:20px 0 0;user-select:none}
.tl-wrap.gone{display:none}

.tl-bar-outer{position:relative;height:32px;cursor:pointer;touch-action:none}
.tl-bar{position:absolute;top:8px;left:0;right:0;height:16px;border-radius:8px;overflow:hidden}
.tl-bar-inner{position:absolute;inset:0;border-radius:8px}
.tl-scrub{position:absolute;width:20px;height:20px;top:6px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,0.5);border:2.5px solid var(--accent);transform:translateX(-50%);cursor:grab;z-index:2;transition:box-shadow 0.1s}
.tl-scrub:active,.tl-scrub.drag{cursor:grabbing;box-shadow:0 2px 14px rgba(0,0,0,0.7)}
.tl-tip{position:absolute;background:var(--surface2);border:1px solid var(--border-mid);border-radius:6px;padding:3px 8px;font-family:var(--mono);font-size:10px;color:var(--text);pointer-events:none;transform:translateX(-50%);top:-26px;white-space:nowrap;z-index:10;display:none}
.tl-tip.show{display:block}
.tl-labels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:6px}
.tl-labels span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}

.controls{display:flex;align-items:center;gap:6px;margin:14px 0 16px}
.controls.gone{display:none}
.btn-ctrl{background:var(--surface);border:1px solid var(--border-mid);color:var(--text);font-family:var(--mono);font-size:12px;padding:6px 13px;border-radius:var(--rad-sm);transition:background 0.1s,border-color 0.1s}
.btn-ctrl:hover{background:var(--surface2);border-color:rgba(255,255,255,0.2)}
.btn-sm{padding:6px 9px;color:var(--text2);font-size:11px}
.btn-now{font-family:var(--sans);font-size:12px;font-weight:500;min-width:60px}
.btn-now.live{color:var(--green);border-color:rgba(61,220,132,0.4);background:rgba(61,220,132,0.06)}
.btn-now.live::before{content:'';display:inline-block;width:6px;height:6px;background:var(--green);border-radius:50%;margin-right:6px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.25}}
.copy-btns{display:flex;gap:6px;margin-left:auto}
.btn-copy,.btn-copy-text{font-family:var(--sans);font-size:12px;font-weight:500}
.btn-copy.done,.btn-copy-text.done{color:var(--green);border-color:rgba(61,220,132,0.4);background:rgba(61,220,132,0.06)}

.legend{display:flex;gap:16px;font-size:10px;color:var(--text3);margin-bottom:20px;flex-wrap:wrap;align-items:center}
.legend.gone{display:none}
.leg-item{display:flex;align-items:center;gap:5px}
.leg-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.leg-keys{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--text3)}

.empty{text-align:center;padding:48px 20px 32px}
.empty-globe{font-size:36px;margin-bottom:12px;opacity:0.3}
.empty-title{font-size:15px;font-weight:500;color:var(--text2);margin-bottom:5px}
.empty-sub{font-size:12px;color:var(--text3);margin-bottom:20px}

.ac::-webkit-scrollbar{width:5px}
.ac::-webkit-scrollbar-track{background:transparent}
.ac::-webkit-scrollbar-thumb{background:var(--border-mid);border-radius:3px}

/* ── Touch: bigger scrubber hit area ─────────── */
@media(hover:none){
  .tl-scrub{width:28px;height:28px;top:2px}
  .rm-btn{opacity:1;width:36px;height:36px;top:4px;right:4px;font-size:18px}
  .city-row:hover .rm-btn{opacity:1}
  .chip{padding:7px 13px 7px 10px;font-size:12px}
  .chip-flag{font-size:15px}
  .btn-ctrl{padding:10px 14px;font-size:13px}
  .ac-item{padding:12px 14px}
}

/* ── Mobile layout ────────────────────────────── */
@media(max-width:600px){
  .wrap{padding:0 14px}

  /* Header */
  .hdr{padding:20px 0 16px;flex-direction:row;align-items:center;gap:0}
  .hdr-sub{display:none}

  /* Search — prevent iOS zoom (needs ≥16px) */
  #search{font-size:16px}

  /* Chips — horizontal scroll, no wrap */
  .chips-wrap{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;gap:7px;scrollbar-width:none}
  .chips-wrap::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0}

  /* Autocomplete — limit height with keyboard up */
  .ac{max-height:220px}

  /* City row — stack into 2-row card on mobile:
     Row 1: flag · city name · status dot
     Row 2: time+date inputs spanning full width    */
  .city-row{
    display:grid;
    grid-template-columns:30px 1fr 12px;
    grid-template-rows:auto auto;
    grid-template-areas:
      "flag meta dot"
      "time time time";
    gap:8px 8px;
    padding:12px 10px 10px;
  }
  .drag-handle{display:none}
  .row-flag{grid-area:flag;font-size:1.5rem}
  .row-meta{grid-area:meta;min-width:0}
  .row-city{font-size:13.5px}
  .row-dot{grid-area:dot;align-self:center;justify-self:end}
  .rm-btn{top:6px;right:6px}

  /* Time block spans full width on row 2 */
  .row-time-block{
    grid-area:time;
    min-width:0;
    text-align:left;
    display:flex;
    align-items:baseline;
    gap:10px;
    border-top:1px solid var(--border);
    padding-top:8px;
  }
  .row-time-block::before{display:none}

  /* Inputs — side by side, left-aligned, iOS zoom fix */
  .time-inp{
    font-size:1.15rem;
    width:auto;
    flex-shrink:0;
    text-align:left;
    padding:4px 6px;
    border-bottom-color:var(--border-mid);
  }
  .date-inp{
    font-size:16px;
    width:auto;
    flex:1;
    text-align:left;
    margin-top:0;
    padding:4px 6px;
    border-bottom-color:var(--border-mid);
    color:var(--text2);
  }
  .search-hint{display:none}

  /* Timeline — taller hit area */
  .tl-bar-outer{height:44px}
  .tl-bar{top:14px;height:16px}
  .tl-scrub{top:10px}
  .tl-tip{display:none !important}
  .tl-labels{font-size:9px}

  /* Controls — two rows: step buttons top, copy bottom */
  .controls{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    grid-template-rows:auto auto;
    gap:6px;
    margin:12px 0 14px;
  }
  .btn-ctrl{padding:10px 4px;font-size:11px;text-align:center}
  .btn-now{grid-column:3}
  .copy-btns{grid-column:1/-1;margin-left:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .btn-copy,.btn-copy-text{width:100%;padding:11px;font-size:13px;text-align:center}

  /* Legend — hide keyboard hints, compress */
  .legend{gap:10px;margin-bottom:16px}
  .leg-keys{display:none}

  /* Overlap bar */
  .overlap-bar{font-size:11px;padding:6px 10px}

  .site-footer{padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px))}
  .footer-brand{font-size:10px}
}
</style>
</head>
<body>
<canvas id="fss-canvas" aria-hidden="true"></canvas>
<div id="app-backdrop" aria-hidden="true"></div>
<div class="wrap">

  <header class="hdr">
    <div class="hdr-brand">
      <a href="https://codingo.com" target="_blank" rel="noopener" class="hdr-logo" title="codingo.com">
        <video class="codingo-mark" autoplay loop muted playsinline preload="auto" aria-label="codingo logo">
          <source src="https://codingo.com/video/codingo-logo.webm" type="video/webm">
          <img src="https://codingo.com/images/codingo-logo.png" alt="codingo logo">
        </video>
      </a>
      <h1>Time Planner</h1>
    </div>
    <a href="https://codingo.com" target="_blank" rel="noopener" class="hdr-sub">codingo.com/time</a>
  </header>

  <div class="search-wrap" id="search-wrap-el">
    <div class="search-row">
      <span class="search-icon">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.4"/>
          <path d="M9.5 9.5L12.5 12.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </span>
      <input id="search" type="text" placeholder="Add a city or time zone…" autocomplete="off" spellcheck="false">
      <span class="search-hint">up to 12</span>
    </div>

function flag(cc){
  if(!cc||cc.length!==2)return'🌐';
  return[...cc.toUpperCase()].map(c=>String.fromCodePoint(0x1F1E6+c.charCodeAt(0)-65)).join('');
}
const _fmtCache={};
function localParts(tz,ms){
  if(!_fmtCache[tz])_fmtCache[tz]=new Intl.DateTimeFormat('en-US',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  const pts=_fmtCache[tz].formatToParts(new Date(ms));
  const p={};pts.forEach(({type,value})=>{p[type]=parseInt(value)});
  if(p.hour===24)p.hour=0;return p;
}
function offsetMins(tz,ms){
  const p=localParts(tz,ms);
  return Math.round((Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-ms)/60000);
}
function fmtOffset(m){
  const s=m>=0?'+':'-';const a=Math.abs(m);const h=Math.floor(a/60),mn=a%60;
  return`UTC${s}${h}${mn?':'+String(mn).padStart(2,'0'):''}`;
}
function tzAbbr(tz,ms){
  try{const pts=new Intl.DateTimeFormat('en-US',{timeZone:tz,timeZoneName:'short'}).formatToParts(new Date(ms));return(pts.find(p=>p.type==='timeZoneName')||{}).value||''}catch{return''}
}
// Default working hours (minutes from midnight)
const DEF_H0=8*60,DEF_H1=17*60;
function minsToTime(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function timeToMins(s){const[h,m]=s.split(':').map(Number);return h*60+(m||0)}

function workStatus(z,ms){
  // z may be a zone object (with h0/h1) or a tz string for backward compat
  const tz=typeof z==='string'?z:z.tz;
  const h0=z.h0??DEF_H0, h1=z.h1??DEF_H1;
  const p=localParts(tz,ms);
  const totalMins=p.hour*60+p.minute;
  if(totalMins>=h0&&totalMins<h1)return'working';
  const shoulder=60;
  if(totalMins>=h0-shoulder&&totalMins<h0)return'shoulder';
  if(totalMins>=h1&&totalMins<h1+shoulder)return'shoulder';
  return'sleeping';
}
function weekendDay(tz,ms){
  const p=localParts(tz,ms);
  const dow=new Date(Date.UTC(p.year,p.month-1,p.day)).getUTCDay();
  if(dow===6)return'SAT';if(dow===0)return'SUN';return null;
}

// ── Public holiday lookup (Nager.Date API) ────────────────────────────────
const _holCache={};  // "CC-YYYY" → Map<"YYYY-MM-DD", name> | null
const _holFlight=new Set();

async function fetchHolidays(cc,year){
  const key=cc+'-'+year;
  if(key in _holCache||_holFlight.has(key))return;
  _holFlight.add(key);
  try{
    const res=await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/${cc}`);
    if(!res.ok){_holCache[key]=null;return}
    const data=await res.json();
    const map=new Map();
    data.forEach(h=>{
      if(h.global!==false)map.set(h.date,h.localName||h.name);
    });
    _holCache[key]=map;
    if(S.zones.length)render();
  }catch{_holCache[key]=null}
  finally{_holFlight.delete(key)}
}

function getHoliday(cc,dateStr){
  const year=dateStr.slice(0,4);
  const key=cc+'-'+year;
  if(!(key in _holCache))fetchHolidays(cc,parseInt(year,10));
  const map=_holCache[key];
  return(map&&map.get(dateStr))||null;
}

function truncHol(name,max=22){return name.length>max?name.slice(0,max-1)+'…':name}
function hourColor(h){
  if(h>=9&&h<17)return'#3ddc84';if((h>=7&&h<9)||(h>=17&&h<20))return'#f0a500';if(h>=20)return'#a0440a';return'#0e1118';
}
function relOffset(refTz,thisTz,ms){
  const diff=offsetMins(thisTz,ms)-offsetMins(refTz,ms);
  if(!diff)return'same time';
  const s=diff>0?'+':'\u2212';const a=Math.abs(diff);const h=Math.floor(a/60),m=a%60;
  return`${s}${h}${m?':'+String(m).padStart(2,'0'):''}h ${diff>0?'ahead':'behind'}`;
}
function fmtShort(tz,ms){
  return new Intl.DateTimeFormat('en-AU',{timeZone:tz,weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit',hour12:true}).format(new Date(ms));
}
function localDateStr(tz,ms){const p=localParts(tz,ms);return`${p.year}-${String(p.month).padStart(2,'0')}-${String(p.day).padStart(2,'0')}`}
function localTimeStr(tz,ms){const p=localParts(tz,ms);return`${String(p.hour).padStart(2,'0')}:${String(p.minute).padStart(2,'0')}`}
function localToUTC(tz,dateStr,timeStr){
  const[yr,mo,dy]=dateStr.split('-').map(Number);const[hr,mn]=timeStr.split(':').map(Number);
  if([yr,mo,dy,hr,mn].some(isNaN))return null;
  const rough=Date.UTC(yr,mo-1,dy,hr,mn,0);const o1=offsetMins(tz,rough);const est=rough-o1*60000;
  return rough-offsetMins(tz,est)*60000;
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function isWorkSlot(z,t){
  const p=localParts(z.tz,t);
  const totalMins=p.hour*60+p.minute;
  const h0=z.h0??DEF_H0, h1=z.h1??DEF_H1;
  if(totalMins<h0||totalMins>=h1)return false;
  const dow=new Date(Date.UTC(p.year,p.month-1,p.day)).getUTCDay();
  if(dow===0||dow===6)return false;
  if(getHoliday(z.cc,`${p.year}-${String(p.month).padStart(2,'0')}-${String(p.day).padStart(2,'0')}`))return false;
  return true;
}
function bestOverlap(zones,refMs){
  if(zones.length<2)return null;
  for(let o=0;o<96;o++){
    const t=Math.floor(refMs/1800000)*1800000+o*1800000;
    if(zones.every(z=>isWorkSlot(z,t)))return t;
  }
  return null;
}
function overlapDuration(zones,startMs){
  let mins=0;
  for(let d=30;d<=480;d+=30){
    if(zones.every(z=>isWorkSlot(z,startMs+d*60000)))mins=d;else break;
  }
  return mins;
}

// ── Overlap window discovery ──────────────────────────────────────────────
// Find all contiguous peak-overlap windows in a 48h scan from baseMs.
// Each window = {t:startMs, tEnd:endMs, count:zonesInHours, out:[unavailableNames]}
function findOverlapWindows(zones,baseMs){
  if(zones.length<2)return[];
  const slots=[];
  const start=Math.floor(baseMs/1800000)*1800000;
  for(let o=0;o<96;o++){
    const t=start+o*1800000;
    const inWork=zones.filter(z=>isWorkSlot(z,t));
    slots.push({t,count:inWork.length,
      out:zones.filter(z=>!isWorkSlot(z,t)).map(z=>z.n.split(',')[0])});
  }
  const maxCount=Math.max(...slots.map(s=>s.count));
  if(maxCount===0)return[];
  // Group consecutive maxCount slots into windows, tracking full start→end range
  const wins=[];let cur=null;
  for(const s of slots){
    if(s.count>=maxCount){
      if(!cur){cur={t:s.t,tEnd:s.t+1800000,count:s.count,out:s.out};wins.push(cur);}
      else{cur.tEnd=s.t+1800000;} // extend window to cover this slot
    }else{cur=null;}
  }
  return wins;
}

// Cache: recompute only when zones change or refMs drifts >47h from scan base
let _olWins=null,_olBase=0,_olZoneKey='';
function getOverlapWindows(){
  const key=S.zones.map(z=>z.tz).join(',');
  const base=Math.floor(S.refMs/1800000)*1800000;
  if(!_olWins||key!==_olZoneKey||Math.abs(base-_olBase)>169200000){
    _olBase=base;_olZoneKey=key;
    _olWins=findOverlapWindows(S.zones,_olBase);
  }
  return _olWins;
}
function nearestWinIdx(wins){
  if(!wins.length)return 0;
  let best=0,bestD=Infinity;
  wins.forEach((w,i)=>{const d=Math.abs(w.t-S.refMs);if(d<bestD){bestD=d;best=i;}});
  return best;
}

function renderOverlap(){
  const el=document.getElementById('overlap-bar');
  const olMsg=document.getElementById('ol-msg');
  const olNav=document.getElementById('ol-nav');
  const olCount=document.getElementById('ol-count');
  if(S.zones.length<2){el.className='overlap-bar';delete el.dataset.t;return}
  const wins=getOverlapWindows();
  if(!wins.length){
    el.className='overlap-bar none';
    olMsg.textContent='✕ No working-hours overlap in the next 48h (exc. weekends & holidays)';
    olNav.className='ol-nav hidden';delete el.dataset.t;return;
  }
  const idx=nearestWinIdx(wins);
  const w=wins[idx];
  const isFull=w.count===S.zones.length;
  const refTz=S.zones[0].tz;
  el.className='overlap-bar '+(isFull?'has':'partial');
  el.dataset.t=String(w.t);

  // Duration of this window
  const durMs=w.tEnd-w.t;
  const durH=Math.floor(durMs/3600000),durM=Math.floor((durMs%3600000)/60000);
  const durStr=durH>0?(durM>0?`${durH}h ${durM}m`:`${durH}h`):`${durM}m`;

  // Format start & end times
  const fmtT=ms=>new Intl.DateTimeFormat('en-AU',{timeZone:refTz,hour:'numeric',minute:'2-digit',hour12:true}).format(new Date(ms));
  const fmtD=ms=>new Intl.DateTimeFormat('en-AU',{timeZone:refTz,weekday:'short',day:'numeric',month:'short'}).format(new Date(ms));

  // Only show "Now" when in live mode AND we're inside this window
  const isNow=S.isLive&&w.t<=S.refMs&&S.refMs<w.tEnd;

  let msg;
  if(isNow){
    const remMs=w.tEnd-S.refMs;
    const remH=Math.floor(remMs/3600000),remM=Math.floor((remMs%3600000)/60000);
    const remStr=remH>0?(remM>0?`${remH}h ${remM}m left`:`${remH}h left`):`${remM}m left`;
    msg=`↔ Now until ${fmtT(w.tEnd)} ${fmtD(w.tEnd)} (${remStr})`;
  }else{
    msg=`↔ ${fmtD(w.t)}, ${fmtT(w.t)} – ${fmtT(w.tEnd)} (${durStr} window)`;
  }
  if(!isFull){
    msg=msg.replace('↔','~')+` · ${w.out.join(', ')} unavailable`;
  }
  olMsg.textContent=msg;

  if(wins.length>1){
    olNav.className='ol-nav';
    olCount.textContent=`${idx+1}/${wins.length}`;
  }else{
    olNav.className='ol-nav hidden';
  }
}

function navOverlap(dir){
  const wins=getOverlapWindows();
  if(wins.length<2)return;
  const idx=nearestWinIdx(wins);
  const next=wins[(idx+dir+wins.length)%wins.length];
  setLive(false);
  S.refMs=next.t; // jump to exact window start — no offset
  initWin();syncURL();render();
}

function doSearch(q){
  if(!q.trim())return[];
  const lq=q.toLowerCase().replace(/[''`]/g,'').trim();
  const seen=new Set();

  // Check if query exactly matches a known abbreviation → boost those IANA zones to top
  const abbrTz=TZ_ABBR[lq];

  return DB.filter(c=>{
    const k=c.n+c.tz;if(seen.has(k))return false;seen.add(k);
    const nl=c.n.toLowerCase(),cl=c.c.toLowerCase();
    const tl=c.tz.toLowerCase().replace(/_/g,' ').replace(/\//g,' ');
    // Also search against city's own abbreviation at current refMs
    const abbr=tzAbbr(c.tz,S.refMs).toLowerCase();
    if(abbrTz)return c.tz===abbrTz||c.tz.startsWith(abbrTz);
    return nl.includes(lq)||cl.includes(lq)||tl.includes(lq)||abbr.includes(lq);
  }).sort((a,b)=>{
    const ae=a.n.toLowerCase()===lq?0:a.n.toLowerCase().startsWith(lq)?1:2;
    const be=b.n.toLowerCase()===lq?0:b.n.toLowerCase().startsWith(lq)?1:2;
    if(ae!==be)return ae-be;return b.p-a.p;
  }).slice(0,8);
}

    <div class="ac-meta">${tzAbbr(c.tz,S.refMs)}<br>${fmtOffset(offsetMins(c.tz,S.refMs))}</div>
  </div>`).join('');
  acEl.classList.remove('hidden');
}

const _gradCache={};
function buildGradient(tz){
  const key=tz+'|'+winStart;
  if(_gradCache[key])return _gradCache[key];
  const stops=[];
  for(let h=0;h<72;h++){
    const t=winStart+h*3600000;const lh=localParts(tz,t).hour;const col=hourColor(lh);
    const a=(h/72*100).toFixed(2),b=((h+1)/72*100).toFixed(2);
    stops.push(`${col} ${a}%`,`${col} ${b}%`);
  }
  const grad=`linear-gradient(to right,${stops.join(',')})`;
  _gradCache[key]=grad;
  return grad;
}
function addCity(city){
  if(S.zones.length>=12){toast('Maximum 12 locations');return}
  if(S.zones.some(z=>z.tz===city.tz&&z.n===city.n))return;

}

async function doCopyText(){
  if(!S.zones.length)return;
  const refTz=S.zones[0].tz;
  const p=localParts(refTz,S.refMs);
  const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dow=new Date(Date.UTC(p.year,p.month-1,p.day)).getUTCDay();
  const lines=[`${DAYS[dow]} ${p.day} ${MONTHS[p.month-1]} ${p.year}`,``];
  S.zones.forEach(z=>{
    const abbr=tzAbbr(z.tz,S.refMs)||fmtOffset(offsetMins(z.tz,S.refMs));
    const ts=localTimeStr(z.tz,S.refMs);
    const[hh,mm]=ts.split(':').map(Number);
    const h12=hh===0?12:hh>12?hh-12:hh;
    const ap=hh<12?'am':'pm';
    const timeDisp=`${h12}:${String(mm).padStart(2,'0')} ${ap}`;
    const status=workStatus(z,S.refMs);
    const wknd=weekendDay(z.tz,S.refMs);
    const hol=getHoliday(z.cc,localDateStr(z.tz,S.refMs));
    const icon=(wknd||hol)?'✗':status==='working'?'✓':status==='shoulder'?'~':'✗';
    const extra=hol?` (${hol})`:wknd?` (${wknd})`:'';
    lines.push(`${flag(z.cc)} ${z.n}, ${z.c} (${abbr}) — ${timeDisp} ${icon}${extra}`);
  });
  const wins=getOverlapWindows();
  const firstWin=wins.length?wins[0]:null;
  if(firstWin){
    const durMs=firstWin.tEnd-firstWin.t;
    const durH=Math.floor(durMs/3600000),durM=Math.floor((durMs%3600000)/60000);
    const durStr=durH>0?(durM>0?`${durH}h ${durM}m`:`${durH}h`):`${durM}m`;
    const isNow=S.isLive&&firstWin.t<=S.refMs&&S.refMs<firstWin.tEnd;
    const fmtT=ms=>new Intl.DateTimeFormat('en-AU',{timeZone:refTz,hour:'numeric',minute:'2-digit',hour12:true}).format(new Date(ms));
    const fmtD=ms=>new Intl.DateTimeFormat('en-AU',{timeZone:refTz,weekday:'short',day:'numeric',month:'short'}).format(new Date(ms));
    lines.push(``);
    lines.push(isNow
      ?`↔ Best overlap: Now (window closes ${fmtT(firstWin.tEnd)} ${fmtD(firstWin.tEnd)})`
      :`↔ Best overlap: ${fmtD(firstWin.t)}, ${fmtT(firstWin.t)} – ${fmtT(firstWin.tEnd)} (${durStr} window)`);
  }
  lines.push(``);lines.push(`Suggest changes: ${location.href}`);
  try{
    await navigator.clipboard.writeText(lines.join('\n'));
    const b=document.getElementById('btn-copy-text');
    b.textContent='✓ Copied';b.classList.add('done');
    setTimeout(()=>{b.textContent='Copy text';b.classList.remove('done')},2200);
  }catch{toast('Copy the text manually')}
}

function syncURL(){
  const parts=[];
  if(!S.isLive)parts.push(new Date(S.refMs).toISOString().slice(0,16)+'Z');
  S.zones.forEach(z=>{
    const h0=z.h0??DEF_H0, h1=z.h1??DEF_H1;
    const custom=(h0!==DEF_H0||h1!==DEF_H1)?`@${minsToTime(h0)}-${minsToTime(h1)}`:'';
    parts.push(z.tz+custom);
  });
  const hash=parts.length?'#'+parts.join('+'):'';
  history.replaceState(null,'',location.pathname+hash);
}
function loadURL(){
  const hash=location.hash.slice(1);
  if(hash){
    const parts=hash.split('+');
    let i=0;
    if(parts[0]&&/^\d{4}-\d{2}-\d{2}T/.test(parts[0])){
      const t=new Date(parts[0]).getTime();
      if(!isNaN(t)){S.refMs=t;S.isLive=false;}
      i=1;
    }
    const seen=new Set();
    for(;i<parts.length;i++){
      let raw=decodeURIComponent(parts[i]);
      if(!raw)continue;
      // Parse optional working hours suffix: TZ@HH:MM-HH:MM
      let h0=DEF_H0,h1=DEF_H1;
      const atIdx=raw.lastIndexOf('@');
      let tz=raw;
      if(atIdx>0){
        const hrPart=raw.slice(atIdx+1);
        const hrMatch=hrPart.match(/^(\d{1,2}:\d{2})-(\d{1,2}:\d{2})$/);
        if(hrMatch){h0=timeToMins(hrMatch[1]);h1=timeToMins(hrMatch[2]);tz=raw.slice(0,atIdx);}
      }
      if(seen.has(tz))continue;seen.add(tz);
      const city=DB.find(c=>c.tz===tz);
      if(city&&S.zones.length<12)S.zones.push({...city,h0,h1});
    }
    return;
  }
  // Fallback: old query-string format (backward compatible)
  const p=new URLSearchParams(location.search);
  const t=p.get('t');if(t){S.refMs=new Date(t).getTime();S.isLive=false}
  const seen=new Set();
  p.getAll('z').forEach(str=>{
    let tz,nm;
    if(str.includes('|')){const sep=str.lastIndexOf('|');nm=str.slice(0,sep);tz=str.slice(sep+1)}
    else{tz=str}
    if(seen.has(tz))return;seen.add(tz);
    const city=nm?DB.find(c=>c.n===nm&&c.tz===tz)||DB.find(c=>c.tz===tz):DB.find(c=>c.tz===tz);
    if(city&&S.zones.length<12)S.zones.push({...city,h0:DEF_H0,h1:DEF_H1});
  });
}

// Build <option> elements for work-hours selects — 30-min increments, 12h AM/PM
function hourOpts(selectedMins){
  let out='';
  for(let m=0;m<24*60;m+=30){
    const h=Math.floor(m/60),mn=m%60,mn2=mn===0?'00':'30';
    const period=h<12?'AM':'PM',h12=h===0?12:h>12?h-12:h;
    const label=`${h12}:${mn2} ${period}`;
    out+=`<option value="${m}"${m===selectedMins?' selected':''}>${label}</option>`;
  }
  return out;
}

  });
}

<script>
// ── Flat Surface Shader — low-poly animated background ────────────────────
// Inspired by FSS.js (Matthew Wagerfield, MIT). Self-contained implementation.
// Colour palette tuned to match codingo.com (dark + green accent).
(function(){
  const canvas=document.getElementById('fss-canvas');
  const ctx=canvas.getContext('2d');

  // Config
  const COLS=12, ROWS=8;
  const BG='#0b0d0f';
  const AMBIENT=0.22;
  const DIFFUSE_MAX=0.62;
  const DEPTH=80;
  const LIGHT_SPEED=0.0007;
  // Colour cycle: full 0→360 hue rotation matching codingo.com exactly.
  // codingo uses: step += 360 * 2e-4 per frame, HSL(step, 96%, 40%)
  let _hue=152; // start at codingo-green, but will rotate through full spectrum
  const HUE_STEP=360*2e-4; // 0.072°/frame = full cycle in ~83s at 60fps

  // HSL→RGB — used every frame to compute shifted light colour
  function hsl2rgb(h,s,l){
    s/=100;l/=100;
    const k=n=>(n+h/30)%12;
    const a=s*Math.min(l,1-l);
    const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
    return[Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255)];
  }

  // On touch devices throttle to ~30fps — decorative bg doesn't need 60
  const isMobile=window.matchMedia('(hover:none)').matches;
  const FRAME_MS=isMobile?33:0;   // 0 = unlimited (native RAF)

  let W,H,verts=[],tris=[],lightX,lightY,lightZ=220;
  let lastFrameMs=0,running=true;

  // Resize — rebuild grid
  function resize(){
    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;
    buildMesh();
  }

  function buildMesh(){
    verts=[];tris=[];
    const cw=W/(COLS-1), ch=H/(ROWS-1);
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        verts.push({
          ox:c*cw, oy:r*ch,
          x:0,y:0,z:0,
          // random phase per vertex for organic motion
          px:Math.random()*Math.PI*2,
          py:Math.random()*Math.PI*2,
          pz:Math.random()*Math.PI*2,
          sx:(Math.random()*0.4+0.6)*LIGHT_SPEED*1800,
          sy:(Math.random()*0.4+0.6)*LIGHT_SPEED*1600,
          sz:(Math.random()*0.4+0.6)*LIGHT_SPEED*2000,
        });
      }
    }
    // Build triangles from grid
    for(let r=0;r<ROWS-1;r++){
      for(let c=0;c<COLS-1;c++){
        const tl=r*COLS+c, tr=tl+1, bl=tl+COLS, br=bl+1;
        tris.push([tl,tr,bl]);
        tris.push([tr,br,bl]);
      }
    }
  }

  // Lerp a vertex displacement over time
  function animVerts(ms){
    const t=ms*LIGHT_SPEED;
    verts.forEach(v=>{
      v.x=v.ox + Math.sin(t*v.sx+v.px)*DEPTH*0.6;
      v.y=v.oy + Math.sin(t*v.sy+v.py)*DEPTH*0.45;
      v.z=        Math.sin(t*v.sz+v.pz)*DEPTH;
    });
  }

  // Light position orbits in a slow Lissajous path — matches codingo motion
  function lightPos(ms){
    const t=ms*LIGHT_SPEED;
    lightX=W*0.5 + W*0.4*Math.sin(t*1.3);
    lightY=H*0.5 + H*0.3*Math.cos(t*0.9);
  }

  // Normal of triangle (for lighting)
  function triNormal(a,b,c){
    const ax=b.x-a.x, ay=b.y-a.y, az=b.z-a.z;
    const bx=c.x-a.x, by=c.y-a.y, bz=c.z-a.z;
    const nx=ay*bz-az*by, ny=az*bx-ax*bz, nz=ax*by-ay*bx;
    const len=Math.sqrt(nx*nx+ny*ny+nz*nz)||1;
    return[nx/len,ny/len,nz/len];
  }

  // Centroid of triangle
  function centroid(a,b,c){
    return[(a.x+b.x+c.x)/3,(a.y+b.y+c.y)/3,(a.z+b.z+c.z)/3];
  }

  // Diffuse lighting — dot product of normal with light direction
  function diffuse(norm,cx,cy,cz){
    const dx=lightX-cx, dy=lightY-cy, dz=lightZ-cz;
    const len=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;
    return Math.max(0,norm[0]*dx/len+norm[1]*dy/len+norm[2]*dz/len);
  }

  // Map diffuse 0..1 to a colour in the codingo palette
  // Dark polygons: near-black dark-green/navy
  // Bright polygons: green accent highlight
  function triColor(d,sh){
    const total=Math.min(1,AMBIENT+d*DIFFUSE_MAX);
    const sr=[9,11,14];
    return[
      Math.min(255,Math.round(sr[0]+(sh[0]-sr[0])*total)),
      Math.min(255,Math.round(sr[1]+(sh[1]-sr[1])*total)),
      Math.min(255,Math.round(sr[2]+(sh[2]-sr[2])*total))
    ];
  }

  function draw(ms){
    animVerts(ms);
    lightPos(ms);
    _hue=(_hue+HUE_STEP)%360; // full-spectrum rotation matching codingo's 360*2e-4/frame
    const sh=hsl2rgb(_hue,96,40); // HSL(hue, 96%, 40%) — exact codingo params
    ctx.fillStyle=BG;
    ctx.fillRect(0,0,W,H);
    tris.forEach(([ai,bi,ci])=>{
      const a=verts[ai],b=verts[bi],c=verts[ci];
      const norm=triNormal(a,b,c);
      const [cx,cy,cz]=centroid(a,b,c);
      const d=diffuse(norm,cx,cy,cz);
      const [r,g,b2]=triColor(d,sh);
      ctx.beginPath();
      ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);
      ctx.closePath();
      ctx.fillStyle=`rgb(${r},${g},${b2})`;
      ctx.fill();
      ctx.strokeStyle=`rgb(${Math.max(0,r-8)},${Math.max(0,g-8)},${Math.max(0,b2-8)})`;
      ctx.lineWidth=0.7;
      ctx.stroke();
    });
  }

  let rafId;
  function loop(ms){
    if(!running)return;
    if(FRAME_MS&&ms-lastFrameMs<FRAME_MS){rafId=requestAnimationFrame(loop);return}
    lastFrameMs=ms;
    draw(ms);
    rafId=requestAnimationFrame(loop);
  }

  // Pause when tab hidden to save CPU
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){running=false;cancelAnimationFrame(rafId)}
    else{running=true;rafId=requestAnimationFrame(loop)}
  });

  // Reduced-motion: skip animation entirely
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches){
    resize();
    draw(1000);
    canvas.classList.add('ready');
    const bd=document.getElementById('app-backdrop');
    if(bd)bd.classList.add('ready');
    return;
  }

  window.addEventListener('resize',()=>{resize();});
  resize();
  // Fade in after first paint
  requestAnimationFrame(ms=>{
    draw(ms);
    canvas.classList.add('ready');
    const bd=document.getElementById('app-backdrop');
    if(bd)bd.classList.add('ready');
    rafId=requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
